services:
  postgres:
    image: pgvector/pgvector:pg17
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_plane}
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane_dev_only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d ${POSTGRES_DB:-control_plane}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-monitored:
    build:
      context: infra/mongo
      dockerfile: Dockerfile
    image: autonomous-nosql-optimizer-mongo:8.0
    platform: linux/amd64
    profiles: ["light"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: control_plane_root
      MONGO_INITDB_ROOT_PASSWORD: control_plane_root_dev_only
    command: ["mongod", "--replSet", "rs-monitored", "--bind_ip_all", "--auth", "--keyFile", "/tmp/mongodb-replica-keyfile", "--slowms", "${MONGO_SLOWMS:-5}"]
    secrets:
      - source: mongodb_replica_keyfile
        target: mongodb_replica_keyfile
    ports:
      - "127.0.0.1:${MONGO_MONITORED_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-evaluation:
    build:
      context: infra/mongo
      dockerfile: Dockerfile
    image: autonomous-nosql-optimizer-mongo:8.0
    platform: linux/amd64
    profiles: ["light", "replica-test"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: control_plane_root
      MONGO_INITDB_ROOT_PASSWORD: control_plane_root_dev_only
    command: ["mongod", "--replSet", "rs-evaluation", "--bind_ip_all", "--auth", "--keyFile", "/tmp/mongodb-replica-keyfile"]
    secrets:
      - source: mongodb_replica_keyfile
        target: mongodb_replica_keyfile
    ports:
      - "127.0.0.1:${MONGO_EVALUATION_HOST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-monitored-init:
    image: mongo:8.0
    platform: linux/amd64
    profiles: ["light"]
    depends_on:
      mongo-monitored:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/init-replica-set.sh", "mongo-monitored", "rs-monitored"]

  mongo-evaluation-init:
    image: mongo:8.0
    platform: linux/amd64
    profiles: ["light", "replica-test"]
    depends_on:
      mongo-evaluation:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/init-replica-set.sh", "mongo-evaluation", "rs-evaluation"]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://control_plane:control_plane_dev_only@postgres:5432/${POSTGRES_DB:-control_plane}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://control_plane:control_plane_dev_only@postgres:5432/${POSTGRES_DB:-control_plane}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your environment or .env file}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    secrets:
      - source: control_plane_master_key
        target: control_plane_master_key
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; assert urlopen('http://localhost:8000/health/ready').status == 200\""]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  worker:
    build:
      context: .
      dockerfile: backend/worker.Dockerfile
    platform: linux/amd64
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://control_plane:control_plane_dev_only@postgres:5432/${POSTGRES_DB:-control_plane}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your environment or .env file}
      # Mongo credentials live only in this worker-mounted secret, never in the API.
      TARGET_CONNECTIONS_FILE: /run/secrets/target_connections
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma4:e4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-30}
      MONITORING_WINDOW_SECONDS: ${MONITORING_WINDOW_SECONDS:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["light", "replica-test", "paper"]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    secrets:
      - source: control_plane_master_key
        target: control_plane_master_key
      - source: target_connections
        target: target_connections
    healthcheck:
      test: ["CMD-SHELL", "python -m app.worker.service --healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  nosqlbench-smoke:
    image: nosqlbench/nosqlbench:5.25.13
    platform: linux/amd64
    profiles: ["bench"]
    volumes:
      - ./benchmarks/nosqlbench:/workloads:ro
    command: ["run", "driver=stdout", "workload=/workloads/smoke.yaml", "cycles=3"]

secrets:
  control_plane_master_key:
    file: ${CONTROL_PLANE_MASTER_KEY_FILE:-./.secrets/control_plane_master_key}
  mongodb_replica_keyfile:
    file: ${MONGODB_REPLICA_KEYFILE:-./.secrets/mongodb_replica_keyfile}
  target_connections:
    file: ${TARGET_CONNECTIONS_HOST_FILE:-./infra/dev/target_connections.json}
